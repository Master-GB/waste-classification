project:
  name: waste-classification
  seed: 42

data:
  dataset_root: data/raw/garbage-dataset
  manifest_dir: data/manifests
  num_classes: 10
  image_size: 224

training:
  epochs: 10
  batch_size: 32
  num_workers: 2
  learning_rate: 0.001
  weight_decay: 0.0001

model:
  name: vit_b16
  pretrained: true
  num_classes: 10
  freeze_backbone: true

optimizer:
  name: AdamW

experiment:
  name: vit_b16_frozen_backbone
  seed: 42

classes:
  - battery
  - biological
  - cardboard
  - clothes
  - glass
  - metal
  - paper
  - plastic
  - shoes
  - trash